name: P08-E4 professional artifact WebKit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  professional-webkit:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Editor Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install Editor Core dependencies and pinned Playwright
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save playwright@1.62.1
      - name: Install pinned WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Build independently bounded professional browser artifact
        run: npm run build:browser:professional
      - name: Run P08-E4 professional artifact WebKit regression
        run: node scripts/p08e4-webkit-professional-artifact-regression.mjs
