name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Node ${{ matrix.node }} core
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install admitted build dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Install verified Audio Engine dependencies
        run: npm run install:verified-audio
      - name: Validate repository contracts
        run: npm run validate
      - name: Build and test
        run: npm test
      - name: Diagnose Sonar reliability annotation
        if: ${{ always() && matrix.node == 20 }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            checks="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")"
            sonar_id="$(CHECKS="$checks" python3 - <<'PY'
import json, os
data=json.loads(os.environ["CHECKS"])
runs=[r for r in data.get("check_runs",[]) if r.get("name")=="SonarCloud Code Analysis"]
if runs:
    print(runs[0]["id"])
PY
)"
            if [ -n "$sonar_id" ]; then
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/check-runs/$sonar_id/annotations?per_page=100"
              exit 0
            fi
            sleep 10
          done
          echo "Sonar check-run was not found for head $HEAD_SHA" >&2
          exit 1
