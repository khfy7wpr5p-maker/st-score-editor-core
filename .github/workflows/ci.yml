name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Node ${{ matrix.node }} core
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install admitted build dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Install verified Audio Engine dependencies
        run: npm run install:verified-audio
      - name: Validate repository contracts
        run: npm run validate
      - name: Build and test
        run: npm test
      - name: Diagnose main Sonar debt
        if: ${{ matrix.node == 20 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== OPEN NEW-CODE ISSUES ==="
          curl -fsSL --retry 3             "https://sonarcloud.io/api/issues/search?componentKeys=khfy7wpr5p-maker_st-score-editor-core&branch=main&issueStatuses=OPEN%2CCONFIRMED&sinceLeakPeriod=true&ps=100"             | python3 -m json.tool
          echo "=== DUPLICATION BY FILE ==="
          curl -fsSL --retry 3             "https://sonarcloud.io/api/measures/component_tree?component=khfy7wpr5p-maker_st-score-editor-core&branch=main&metricKeys=new_duplicated_lines_density,new_duplicated_lines&qualifiers=FIL&ps=500"             | python3 -m json.tool
          echo "=== RENDERER LOCK GZIP BASE64 ==="
          renderer_tmp="$(mktemp -d)"
          git clone --quiet https://github.com/khfy7wpr5p-maker/st-score-rendering-layer.git "$renderer_tmp/repo"
          cd "$renderer_tmp/repo"
          git checkout --quiet --detach 70c21ad73c0b2e9c71e415cc3272a10673df9d60
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 -c 'import base64,gzip,pathlib; data=pathlib.Path("package-lock.json").read_bytes(); print(base64.b64encode(gzip.compress(data,compresslevel=9)).decode("ascii"))'
          cd "$GITHUB_WORKSPACE"
          rm -rf "$renderer_tmp"