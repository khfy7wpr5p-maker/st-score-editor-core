name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Node ${{ matrix.node }} core
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install admitted build dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Install verified Audio Engine dependencies
        run: npm run install:verified-audio
      - name: Validate repository contracts
        run: npm run validate
      - name: Build and test
        run: npm test

  sonar-diagnostic:
    name: Sonar main diagnostic
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Read main Sonar duplication candidates
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PR 201 SONAR ISSUES ==="
          curl -fsSL --retry 3 \
            "https://sonarcloud.io/api/issues/search?componentKeys=khfy7wpr5p-maker_st-score-editor-core&pullRequest=201&issueStatuses=OPEN%2CCONFIRMED&sinceLeakPeriod=true&ps=100" \
            | python3 -m json.tool
          echo "=== MAIN SONAR ISSUES ==="
          curl -fsSL --retry 3 \
            "https://sonarcloud.io/api/issues/search?componentKeys=khfy7wpr5p-maker_st-score-editor-core&branch=main&issueStatuses=OPEN%2CCONFIRMED&sinceLeakPeriod=true&ps=100" \
            | python3 -m json.tool
          echo "=== MAIN DUPLICATION CANDIDATES ==="
          curl -fsSL --retry 3 \
            "https://sonarcloud.io/api/measures/component_tree?component=khfy7wpr5p-maker_st-score-editor-core&branch=main&metricKeys=duplicated_lines,duplicated_lines_density,new_lines&qualifiers=FIL&ps=500" \
            | python3 -m json.tool