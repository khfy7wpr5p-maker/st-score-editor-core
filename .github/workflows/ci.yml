name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Node ${{ matrix.node }} core
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install admitted build dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Install verified Audio Engine dependencies
        run: npm run install:verified-audio
      - name: Validate repository contracts
        run: npm run validate
      - name: Build and test
        run: npm test
  partitura-import:
    name: Python 3.12 Partitura import boundary
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Partitura import dependency
        run: python -m pip install --disable-pip-version-check -r services/partitura_import/requirements.txt
      - name: Test bounded Partitura import boundary
        run: python -m unittest discover -s services/partitura_import/tests -p "test_*.py" -v
