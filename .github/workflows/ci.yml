name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Node ${{ matrix.node }} core
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install admitted build dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Install verified Audio Engine dependencies
        run: npm run install:verified-audio
      - name: Validate repository contracts
        run: npm run validate
      - name: Build and test
        run: npm test
      - name: Diagnose main Sonar issues
        if: ${{ matrix.node == 20 }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://sonarcloud.io/api/issues/search?componentKeys=khfy7wpr5p-maker_st-score-editor-core&branch=main&issueStatuses=OPEN%2CCONFIRMED&sinceLeakPeriod=true&ps=100" \
            | python3 -m json.tool
          echo "=== MAIN NEW-CODE PERIOD ==="
          curl -fsSL --retry 3 \
            "https://sonarcloud.io/api/new_code_periods/show?project=khfy7wpr5p-maker_st-score-editor-core&branch=main" \
            | python3 -m json.tool
          echo "=== MAIN DUPLICATION CANDIDATES ==="
          curl -fsSL --retry 3 \
            "https://sonarcloud.io/api/measures/component_tree?component=khfy7wpr5p-maker_st-score-editor-core&branch=main&metricKeys=duplicated_lines,duplicated_lines_density,new_lines&qualifiers=FIL&ps=500" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[]; 
for c in d.get("components",[]):
 m={}
 for x in c.get("measures",[]):
  p=(x.get("periods") or [{}])[0]
  m[x["metric"]]=float(p.get("value",x.get("value",0)) or 0)
 if m.get("duplicated_lines",0)>0 or m.get("new_lines",0)>0:
  rows.append({"path":c.get("path"),**m})
print(json.dumps(sorted(rows,key=lambda r:(-r.get("new_lines",0),-r.get("duplicated_lines",0)))[:200],indent=2))'