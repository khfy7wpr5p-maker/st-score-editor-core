name: P10-3B Professional Range Replace WebKit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  p10-3b-professional-range-replace-webkit:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Editor Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install exact Editor Core dependencies and verified audio with pinned Playwright
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock \
            saxes@6.0.0 xmlchars@2.2.0 esbuild@0.28.2 typescript@6.0.3
          npm run install:verified-audio -- --with-playwright
      - name: Install pinned WebKit browser
        run: node node_modules/playwright/cli.js install --with-deps webkit
      - name: Build retained and bounded P10-3B professional workstation artifact
        run: |
          npm run build:browser:professional-workstation
          node scripts/build-p10-2-professional-workstation-browser.mjs
          node scripts/build-p10-3a-professional-workstation-browser.mjs
          node scripts/build-p10-3b-professional-workstation-browser.mjs
      - name: Run P10-3B Professional Range Replace WebKit regression
        run: node scripts/p10-3b-webkit-professional-range-replace-regression.mjs
      - name: Diagnose Sonar reliability annotation
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            checks="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")"
            sonar_id="$(CHECKS="$checks" python3 - <<'PY'
import json, os
data=json.loads(os.environ["CHECKS"])
runs=[r for r in data.get("check_runs",[]) if r.get("name")=="SonarCloud Code Analysis"]
if runs:
    print(runs[0]["id"])
PY
)"
            if [ -n "$sonar_id" ]; then
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/check-runs/$sonar_id/annotations?per_page=100"
              exit 0
            fi
            sleep 10
          done
          echo "Sonar check-run was not found for head $HEAD_SHA" >&2
          exit 1
