name: P-MXML-REF-01 MusicXML compatibility WebKit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  musicxml-compatibility-webkit:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Editor Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Setup Editor WebKit dependencies
        run: bash scripts/setup-editor-webkit-ci.sh
      - name: Build Editor Core browser artifacts
        run: npm run build:browser
      - name: Run P-MXML-REF-01 mobile WebKit MusicXML compatibility regression
        run: node scripts/p-mxml-ref-01-webkit-musicxml-compatibility-regression.mjs
