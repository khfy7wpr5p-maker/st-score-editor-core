name: APP-09B preview WebKit regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Editor Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install Editor Core dependencies and regression Playwright
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save playwright@1.62.1
      - name: Install pinned WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Build Editor Core browser artifacts
        run: npm run build:browser
      - name: Run APP-10E WebKit authoring workspace regression
        run: node scripts/app10e-webkit-authoring-workspace-regression.mjs
      - name: Run APP-10F WebKit selected-note editing regression
        run: node scripts/app10f-webkit-selected-note-editing-regression.mjs
      - name: Run APP-10G WebKit active-staff authoring regression
        run: node scripts/app10g-webkit-active-staff-regression.mjs
      - name: Run APP-10H WebKit measure-frame authoring regression
        run: node scripts/app10h-webkit-measure-frame-regression.mjs
      - name: Run APP-10I WebKit semantic measure navigation regression
        run: node scripts/app10i-webkit-measure-navigation-regression.mjs
      - name: Run APP-10J WebKit bounded chord-tone authoring regression
        run: node scripts/app10j-webkit-chord-tone-authoring-regression.mjs
      - name: Run APP-10K WebKit bounded articulation toggles regression
        run: node scripts/app10k-webkit-articulation-toggles-regression.mjs
      - name: Run APP-10L WebKit bounded local ornament toggles regression
        run: node scripts/app10l-webkit-local-ornament-toggles-regression.mjs
      - name: Run APP-10M WebKit bounded explicit accidentals regression
        run: node scripts/app10m-webkit-explicit-accidentals-regression.mjs
      - name: Run APP-10N WebKit bounded extended articulation toggles regression
        run: node scripts/app10n-webkit-extended-articulation-toggles-regression.mjs
      - name: Run APP-10O WebKit bounded extended local ornament toggles regression
        run: node scripts/app10o-webkit-extended-local-ornament-toggles-regression.mjs
      - name: Checkout exact ST Score Rendering Layer revision
        run: |
          git clone https://github.com/khfy7wpr5p-maker/st-score-rendering-layer.git "$RUNNER_TEMP/st-score-rendering-layer"
          cd "$RUNNER_TEMP/st-score-rendering-layer"
          git checkout --detach 13c32eefccd5bf2c227e815aa27aae4a0583801d
      - name: Build exact renderer runtime
        run: |
          cd "$RUNNER_TEMP/st-score-rendering-layer"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          ST_SCORE_RENDERER_SOURCE_REVISION=13c32eefccd5bf2c227e815aa27aae4a0583801d npm run export:workstation-runtime
      - name: Assemble stable APP-09B preview
        env:
          ST_SCORE_RENDERER_RUNTIME_DIR: ${{ runner.temp }}/st-score-rendering-layer/dist/workstation-runtime
        run: node scripts/assemble-app09b-preview-stable.mjs
      - name: Run APP-09B WebKit renderer regression
        run: node scripts/app09b-webkit-preview-regression.mjs
      - name: Run APP-09B WebKit controlled layout rerender regression
        run: node scripts/app09b-webkit-controlled-layout-regression.mjs
