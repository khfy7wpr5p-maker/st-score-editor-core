name: SES-111 correction analysis E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  correction-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Editor Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run bounded SES-111 qualification
        run: bash scripts/run-ses111-correction-e2e-ci.sh
