name: SES-111 correction analysis E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  correction-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Editor Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Setup Editor WebKit dependencies
        run: bash scripts/setup-editor-webkit-ci.sh
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build Editor Core browser artifacts
        run: npm run build:browser
      - name: Checkout exact ST Score Rendering Layer revision
        run: |
          git clone https://github.com/khfy7wpr5p-maker/st-score-rendering-layer.git "$RUNNER_TEMP/st-score-rendering-layer"
          cd "$RUNNER_TEMP/st-score-rendering-layer"
          git checkout --detach effc13c82eb1e537773541e5a659f435ecb71583
      - name: Build exact renderer runtime
        run: |
          cd "$RUNNER_TEMP/st-score-rendering-layer"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          ST_SCORE_RENDERER_SOURCE_REVISION=effc13c82eb1e537773541e5a659f435ecb71583 npm run export:workstation-runtime
      - name: Checkout exact ST OMR Correction Engine analysis revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: khfy7wpr5p-maker/st-omr-correction-engine
          ref: 2584f68024d76edbaeda3155e13cf5b422bc2457
          path: st-omr-correction-engine
          persist-credentials: false
      - name: Build exact read-only Correction Engine analysis runtime
        run: |
          cd "$GITHUB_WORKSPACE/st-omr-correction-engine"
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build:ce-analysis-browser
      - name: Assemble stable APP-09B correction preview
        env:
          ST_SCORE_RENDERER_RUNTIME_DIR: ${{ runner.temp }}/st-score-rendering-layer/dist/workstation-runtime
          ST_OMR_CORRECTION_ANALYSIS_RUNTIME_DIR: ${{ github.workspace }}/st-omr-correction-engine/dist/browser-analysis
        run: node scripts/assemble-app09b-preview-stable.mjs
      - name: Run SES-111 WebKit correction E2E
        env:
          ST_CE_E2E_BROWSER: webkit
        run: node scripts/ses111-correction-analysis-e2e.mjs
      - name: Run SES-111 Chromium correction E2E
        env:
          ST_CE_E2E_BROWSER: chromium
        run: node scripts/ses111-correction-analysis-e2e.mjs
      - name: Upload SES-111 app and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ses-111-correction-e2e
          if-no-files-found: warn
          retention-days: 7
          path: |
            dist/browser
            artifacts/ses-111
